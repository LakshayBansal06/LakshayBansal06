name: Rebuild profile

# Edit profile.json right on GitHub → every SVG and README.md regenerate.
# Also runs weekly so your avatar in the hero stays in sync with your GitHub photo.
on:
  push:
    branches: [main]
    paths: ["profile.json", "build.py", "avatar.*"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "chore: rebuild profile"
          git push
