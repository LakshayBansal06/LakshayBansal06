<title>Airline Retention: Churn prediction for an airline loyalty programme that tells retention teams who to call first. 12 behavioural segments, Logistic Regression vs Random Forest vs XGBoost, and a 6-page Power BI dashboard. Stack: Power BI, DAX, Alteryx, Scikit-learn, XGBoost.</title>
