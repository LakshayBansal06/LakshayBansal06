<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 Activity — Always shipping.">
<title>06 Activity — Always shipping.</title>
<style>
    .t6-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif; }
    .t6-mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .t6-in { animation: t6-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .t6-pop { animation: t6-pop .7s cubic-bezier(.34,1.56,.64,1) both; }
    .t6-draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: t6-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .t6-pulse { animation: t6-pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t6-blink { animation: t6-blink 1s steps(1) infinite; }
    @keyframes t6-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes t6-pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes t6-draw { to { stroke-dashoffset: 0; } }
    @keyframes t6-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .25; } }
    @keyframes t6-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t6-in, .t6-pop, .t6-pulse, .t6-blink { animation: none !important; }
      .t6-draw { animation: none; stroke-dashoffset: 0; }
    }
    .t6-hex { animation: t6-spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes t6-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .t6-hex { animation: none; } }</style>
  <defs>
    <linearGradient id="t6-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="t6-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t6-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#99F6E4"/><stop offset="1" stop-color="#818CF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1400 0;1400 0" keyTimes="0;.45;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="t6-dot"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#99F6E4" stop-opacity=".8"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  </defs>
  <g class="t6-in">
    <polygon class="t6-hex" points="70,22 96,37 96,67 70,82 44,67 44,37" fill="none" stroke="url(#t6-g)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <polygon points="70,30 89,41 89,63 70,74 51,63 51,41" fill="#2DD4BF" fill-opacity=".1" stroke="url(#t6-g)" stroke-width="1.5"/>
    <text class="t6-mono" x="70" y="58" font-size="16" font-weight="700" text-anchor="middle" fill="#99F6E4">06</text>
  </g>
  <g class="t6-in" style="animation-delay:0.15s">
    <text class="t6-mono" x="122" y="40" font-size="12" letter-spacing="3.5" fill="#2DD4BF">// ACTIVITY</text>
    <text class="t6-sans" x="120" y="80" font-size="38" font-weight="800" letter-spacing="-1" fill="#EAF2FF">Always <tspan fill="url(#t6-sheen)">shipping.</tspan></text>
  </g>
  <g class="t6-in" style="animation-delay:0.30s">
    <text class="t6-mono" x="1160" y="40" text-anchor="end" font-size="11" letter-spacing="2.5" fill="#8B9BB4">GITHUB PULSE</text>
  </g>
  <path class="t6-draw" d="M40 106 H1160" stroke="url(#t6-line)" stroke-width="1.2"/>
  <circle cx="40" cy="106" r="7" fill="url(#t6-dot)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="5s" begin="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.2;1" dur="5s" begin="2s" repeatCount="indefinite"/>
  </circle>
</svg>