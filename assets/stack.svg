<title>Tech stack. Analytics: SQL, Python, Pandas, Excel, MySQL, SQLite. BI &amp; Viz: Power BI, DAX, Alteryx, Streamlit, Excel Dashboards. Machine Learning: XGBoost, Scikit-learn, Random Forest, Logistic Regression, CNN. SQL Craft: JOINs, CTEs, Window functions, CASE logic, Aggregations. Data Quality: Data cleaning, Feature engineering, GeoJSON, OpenStreetMap, IoU matching. Tools: Git, GitHub, Jupyter, VS Code.</title>
