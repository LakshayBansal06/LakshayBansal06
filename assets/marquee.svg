<style>
    .mq-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif; }
    .mq-mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .mq-in { animation: mq-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .mq-pop { animation: mq-pop .7s cubic-bezier(.34,1.56,.64,1) both; }
    .mq-draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: mq-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .mq-pulse { animation: mq-pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .mq-blink { animation: mq-blink 1s steps(1) infinite; }
    @keyframes mq-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes mq-pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes mq-draw { to { stroke-dashoffset: 0; } }
    @keyframes mq-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .25; } }
    @keyframes mq-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .mq-in, .mq-pop, .mq-pulse, .mq-blink { animation: none !important; }
      .mq-draw { animation: none; stroke-dashoffset: 0; }
    }
    .mq-run { animation: mq-run 47.8s linear infinite; }
    @keyframes mq-run { to { transform: translateX(-2151px); } }
