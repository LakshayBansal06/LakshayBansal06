<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="StockSense: Inventory optimization: why stores run out of fast movers while slow SKUs pile up. 20+ SQL queries, 6 demand features and an XGBoost classifier that grades every forecast, shipped as a live Streamlit app. Stack: SQL, Python, Pandas, XGBoost, Streamlit.">
<title>StockSense: Inventory optimization: why stores run out of fast movers while slow SKUs pile up. 20+ SQL queries, 6 demand features and an XGBoost classifier that grades every forecast, shipped as a live Streamlit app. Stack: SQL, Python, Pandas, XGBoost, Streamlit.</title>
<style>
