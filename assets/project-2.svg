<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="TrustPrint: From messy CSV to a trusted dashboard: how much of an AI-drawn world map can a decision-maker trust? Audited 50.4M building footprints across 989 partitions, ran QuadKey provenance checks and IoU matching against OpenStreetMap. Stack: Python, Pandas, GeoJSON, OpenStreetMap, Power BI.">
<title>TrustPrint: From messy CSV to a trusted dashboard: how much of an AI-drawn world map can a decision-maker trust? Audited 50.4M building footprints across 989 partitions, ran QuadKey provenance checks and IoU matching against OpenStreetMap. Stack: Python, Pandas, GeoJSON, OpenStreetMap, Power BI.</title>
<style>
