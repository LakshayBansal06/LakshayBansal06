<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Lakshay Bansal — Got data that won&#x27;t talk? Let&#x27;s make it decisive. Thanks for visiting.">
<title>Lakshay Bansal — Got data that won&#x27;t talk? Let&#x27;s make it decisive. Thanks for visiting.</title>
<style>
    .ft-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif; }
    .ft-mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .ft-in { animation: ft-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .ft-pop { animation: ft-pop .7s cubic-bezier(.34,1.56,.64,1) both; }
    .ft-draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: ft-draw 2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .ft-pulse { animation: ft-pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ft-blink { animation: ft-blink 1s steps(1) infinite; }
    @keyframes ft-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ft-pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes ft-draw { to { stroke-dashoffset: 0; } }
    @keyframes ft-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .25; } }
    @keyframes ft-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ft-in, .ft-pop, .ft-pulse, .ft-blink { animation: none !important; }
      .ft-draw { animation: none; stroke-dashoffset: 0; }
    }
    .ft-w { animation: ft-w 12s linear infinite; } .ft-w.w2 { animation-duration: 18s; animation-direction: reverse; } .ft-w.w3 { animation-duration: 26s; }
    @keyframes ft-w { to { transform: translateX(-1200px); } }
    @media (prefers-reduced-motion: reduce) { .ft-w { animation: none; } }</style>
  <defs>
