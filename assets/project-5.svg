<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-label="IPL Auction: A pure-SQL deep dive that ends in a quantified auction strategy for RCB. Modelled a 20-table IPL database and ranked batting, bowling and venue impact with CTEs and window functions. Stack: MySQL, CTEs, Window functions, JOINs.">
<title>IPL Auction: A pure-SQL deep dive that ends in a quantified auction strategy for RCB. Modelled a 20-table IPL database and ranked batting, bowling and venue impact with CTEs and window functions. Stack: MySQL, CTEs, Window functions, JOINs.</title>
<style>
